version: '3'
services:
  download:
    image: dbpedia/databus-python-client:latest
    env_file: config.env
    environment:
      COLLECTION_URI: ${COLLECTION_URI}
      DATABUS_URI: ${DATABUS_URI}
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT}
      GRAPH_MODE: ${GRAPH_MODE}
    volumes:
      - ${DATA_DIR}:/root/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        touch /root/data/download.lck
        trap 'rm -f /root/data/download.lck' EXIT

        uris=""
        if [ -n "$$COLLECTION_URI" ]; then uris="$$uris $$COLLECTION_URI"; fi
        if [ -n "$$DATABUS_URI" ]; then uris="$$uris $$DATABUS_URI"; fi
        if [ -z "$$uris" ]; then
          echo "[ERROR] Set COLLECTION_URI, DATABUS_URI, or both."
          exit 1
        fi

        databus_args=""
        if [ -n "$$SPARQL_ENDPOINT" ]; then
          databus_args="--databus $$SPARQL_ENDPOINT"
        fi

        databusclient download $$uris \
          --localdir /root/data \
          $$databus_args \
          --graph-mode "$$GRAPH_MODE"
  store:
    image: openlink/virtuoso-opensource-7
    ports: ["${VIRTUOSO_HTTP_PORT}:8890","127.0.0.1:${VIRTUOSO_ISQL_PORT}:1111"]
    env_file: config.env
    environment:
            DBA_PASSWORD: ${VIRTUOSO_ADMIN_PASSWD:?Set VIRTUOSO_ADMIN_PASSWD in .env file or pass as environment variable e.g. VIRTUOSO_ADMIN_PASSWD=YourSecretPass docker-compose up}
    volumes:
      - ${VIRTUOSO_DATABASE_DIR}:/opt/virtuoso-opensource/database
      - ${DATA_DIR}:/usr/share/proj
  quickstart:
    build: ./quickstart/
    env_file: config.env
    environment:
      STORE_DATA_DIR: /usr/share/proj
      STORE_DBA_PASSWORD: ${VIRTUOSO_ADMIN_PASSWD:?Set VIRTUOSO_ADMIN_PASSWD in .env file or pass as environment variable e.g. VIRTUOSO_ADMIN_PASSWD=YourSecretPass docker-compose up}
      STORE_ISQL_PORT: 1111
      DATA_DIR: /root/data
      DOMAIN: ${DOMAIN}
      DBP_LANG: ${DBP_LANG}
      DBP_CATEGORY: ${DBP_CATEGORY}
    volumes:
      - ${DATA_DIR}:/root/data
